---
name: Continuous Integration

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.1.2 # https://github.com/pnpm/setup
        with:
          # Reads .node-version and package.json automatically.
          install: true
          require-lockfile: true
          working-directory: ./frontend
      - run: pnpm run build
      #- run: npm test
